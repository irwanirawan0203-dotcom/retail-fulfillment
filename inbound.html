{% extends "base.html" %}{% block content %}<div class="pagehead"><div><h1>Inbound</h1><p>Barang masuk dan penambahan stok.</p></div></div><form class="card form" method="post"><div class="badge">Nomor dibuat otomatis saat disimpan</div><div class="two"><input type="date" name="arrival_date" required><input name="supplier_code" placeholder="Kode Supplier"></div><input name="supplier_name" placeholder="Nama Supplier"><div class="two"><select name="sku" required><option value="">Pilih SKU</option>{% for p in products %}<option value="{{p.sku}}">{{p.sku}} — {{p.name}}</option>{% endfor %}</select><input type="date" name="exp_date"></div><div class="two"><input type="number" step="0.01" name="price" placeholder="Harga Barang"><input type="number" step="0.01" min="1" name="qty" value="1" placeholder="Qty" required></div><button>Simpan Inbound</button></form><div class="card"><div class="title">Riwayat Inbound</div>{% for x in inbounds %}<div class="row"><div><b>{{x.number}}</b><small>{{x.sku}} · {{x.product_name}}</small></div><strong>+{{x.qty:g}}</strong></div>{% endfor %}</div>{% endblock %}
