{% extends "base.html" %}{% block content %}<div class="pagehead"><div><h1>Request</h1><p>Upload permintaan toko melalui Excel.</p></div></div><form class="card form" method="post" enctype="multipart/form-data"><div class="badge">Nomor Request otomatis</div><select name="store_id" required><option value="">Pilih Toko</option>{% for s in stores %}<option value="{{s.id}}">{{s.code}} — {{s.name}}</option>{% endfor %}</select><input type="file" name="file" accept=".xlsx,.xlsm" required><button>Simpan Request Excel</button><a class="button secondary" href="{{url_for('request_template')}}">⬇ Download Template</a></form>{% for r in requests %}<div class="card row"><div><b>{{r.number}}</b><small>{{r.store_name or '-'}} · {{r.items}} item · {{r.request_date}}</small></div><span class="pill">{{r.status}}</span></div>{% endfor %}{% endblock %}
