{% extends "base.html" %}{% block content %}<div class="pagehead"><div><h1>Stores</h1><p>Kelola toko retail.</p></div></div><form class="card form" method="post"><h3>Tambah Toko Baru</h3><div class="two"><input name="code" placeholder="Kode toko, contoh T017" required><input name="name" placeholder="Nama toko" required></div><button>Simpan Toko</button></form><form class="search"><input name="q" value="{{q}}" placeholder="Cari kode atau nama toko"><button>🔎</button></form>{% for s in stores %}<div class="card row"><div><b>{{s.name}}</b><small>{{s.code}} · {{'Aktif' if s.active else 'Nonaktif'}}</small></div><form method="post" action="{{url_for('toggle_store',id=s.id)}}"><button class="mini {{'danger' if s.active else 'success'}}">{{'Nonaktifkan' if s.active else 'Aktifkan'}}</button></form></div>{% endfor %}{% endblock %}
