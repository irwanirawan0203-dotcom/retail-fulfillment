services:
  - type: web
    name: retail-fulfillment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retail-fulfillment-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: retail-fulfillment-db
    plan: free
    databaseName: retail_fulfillment
    user: retail_user
