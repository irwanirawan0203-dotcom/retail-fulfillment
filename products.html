{% extends "base.html" %}{% block content %}<div class="pagehead"><div><h1>Barang</h1><p>Master SKU & supplier.</p></div></div><div class="actions"><a class="button" href="{{url_for('product_template')}}">⬇ Template Excel</a><label class="button">⬆ Upload Excel<input type="file" id="productFile" accept=".xlsx,.xlsm" hidden></label></div><form id="productUpload" class="upload card" method="post" enctype="multipart/form-data"><input name="file" id="productFileReal" type="file" accept=".xlsx,.xlsm" required><button>Simpan Excel</button></form><form class="search"><input name="q" value="{{q}}" placeholder="Cari Nama Barang / SKU / Supplier"><button>🔎</button></form>{% for p in products %}<div class="card product"><div><b>{{p.name}}</b><small>{{p.sku}} · {{p.supplier or '-'}} · Rp {{'{:,.0f}'.format(p.buy_price)}}</small></div><div class="right"><span class="pill">{{p.stock:g}}</span><form method="post" action="{{url_for('toggle_product',id=p.id)}}"><button class="mini">{{'Nonaktif' if p.active else 'Aktifkan'}}</button></form></div></div>{% endfor %}{% endblock %}
